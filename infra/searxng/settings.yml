use_default_settings: true

general:
  instance_name: Hermes Search
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: auto
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

valkey:
  url: valkey://valkey:6379/0

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 20
  pool_maxsize: 5

