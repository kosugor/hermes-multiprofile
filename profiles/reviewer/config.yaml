database:
  journal_mode: wal
  synchronous: FULL

model:
  provider: openai-codex
  default: gpt-5.6-sol
  openai_runtime: auto

fallback_providers:
  - provider: openrouter
    model: openrouter/free
  - provider: nous
    model: nous/welcome

nous:
  guest: true

plugins:
  enabled:
    - langfuse
    - observability/langfuse
  disabled: []
context:
  engine: compressor

updates:
  check: false
  pre_update_backup: full
  non_interactive_local_changes: stash

agent:
  max_turns: 120
  reasoning_effort: high
  verify_on_stop: false
  disabled_toolsets: [browser, computer_use, code_execution, delegation, messaging, cronjob, skills, skills_hub, memory, session_search, vision, image_gen, tts]

platform_toolsets:
  cli: [file, terminal, web]
  telegram: [file, terminal, web]
  api_server: [file, terminal, web]
  cron: [file, terminal, web]

terminal:
  backend: docker
  timeout: 300
  home_mode: profile
  lifetime_seconds: 600
  docker_image: hermes-coder:python3.11-nodejs20
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: false
  docker_forward_env: []
  docker_network: false
  docker_extra_args:
    - "--pids-limit"
    - "256"
  docker_volumes:
    - "${HERMES_KANBAN_EVIDENCE_DIR}:/evidence:ro"
    - "/home/hermes/.hermes/profiles/wiki-maintainer/skills/maintain-obsidian-wiki:/review-source/maintain-obsidian-wiki:ro"
    - "/home/hermes/.hermes/profiles/wiki-maintainer/skills/scheduled-wiki-maintenance:/review-source/scheduled-wiki-maintenance:ro"
    - "/home/hermes/.hermes/profiles/wiki-maintainer/skills/audit-vault-links:/review-source/audit-vault-links:ro"
    - "/home/hermes/.hermes/profiles/wiki-maintainer/skills/wiki-content-quality:/review-source/wiki-content-quality:ro"
  container_cpu: 1
  container_memory: 1536
  container_persistent: true
  docker_persist_across_processes: false
  persistent_shell: false

web:
  search_backend: searxng
  extract_backend: firecrawl
  keyless_fallback: false
  keyless_rescue: false

skills:
  creation_nudge_interval: 0
kanban:
  dispatch_in_gateway: false
_config_version: 50
_left_core_installed:
  - langfuse
