model:
  provider: openai-codex
  default: gpt-6.1-sol
  openai_runtime: auto
  base_url: https://chatgpt.com/backend-api/codex
fallback_providers:
  - provider: openrouter
    model: openrouter/free
  - provider: nous
    model: nous/welcome
nous:
  guest: true
toolsets:
  - kanban
  - skills
  - cronjob
database:
  journal_mode: wal
  synchronous: FULL
agent:
  max_turns: 120
  verify_on_stop: false
  disabled_toolsets:
    - terminal
    - file
    - web
    - search
    - browser
    - computer_use
    - code_execution
    - delegation
    - messaging
    - skills_hub
    - vision
    - image_gen
    - tts
  reasoning_effort: high
context:
  engine: compressor
skills:
  creation_nudge_interval: 0
plugins:
  enabled:
    - langfuse
    - observability/langfuse
  disabled: []
cron:
  allow_agent_scheduling: false
  preflight: true
  max_parallel_jobs: 1
kanban:
  auto_subscribe_on_create: true
  # The main gateway owns dispatch for every profile on this host.
  dispatch_in_gateway: false
  review_dispatch: true
  dispatch_interval_seconds: 60
  orchestrator_profile: orchestrator
  default_assignee: orchestrator
  max_in_progress: 1
  max_in_progress_per_profile: 1
  auto_decompose: false
  auto_promote_children: true
gateway:
  trust_env: false
  multiplex_profiles: false
sessions:
  auto_prune: true
  retention_days: 90
  vacuum_after_prune: true
  min_vacuum_interval_days: 30
updates:
  check: false
  pre_update_backup: full
  non_interactive_local_changes: stash
_config_version: 50
platform_toolsets:
  cli:
    - clarify
    - connections
    - kanban
    - memory
    - session_search
    - todo
  telegram:
    - clarify
    - connections
    - kanban
    - memory
    - session_search
    - todo
  api_server:
    - clarify
    - connections
    - kanban
    - memory
    - session_search
    - todo
  cron:
    - clarify
    - connections
    - kanban
    - memory
    - session_search
    - todo
telemetry:
  shared_metrics:
    enabled: true
    send: true
dashboard:
  theme: default-large
memory:
  write_approval: false
approvals:
  destructive_slash_confirm: false
_left_core_installed:
  - langfuse
