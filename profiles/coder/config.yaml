database:
  journal_mode: wal
  synchronous: FULL

model:
  provider: openai-codex
  default: gpt-5.6-sol
  openai_runtime: auto

fallback_providers:
  - provider: openrouter
    model: openrouter/free
  - provider: nous
    model: nous/welcome

nous:
  guest: true

updates:
  check: false
  pre_update_backup: full
  non_interactive_local_changes: stash

plugins:
  enabled:
    - hermes-lcm
    - observability/langfuse
  disabled:
    - hermes-lcm
context:
  engine: lcm

agent:
  max_turns: 160
  reasoning_effort: high
  verify_on_stop: true
  disabled_toolsets: [browser, web, computer_use, code_execution, delegation, messaging, cronjob, skills, skills_hub, vision, image_gen, tts]
  coding_instructions:
    - Work only in the Kanban-provided workspace mounted at /workspace.
    - Never push, merge, publish, deploy, or alter remotes.
    - Network access in terminal containers is intentionally unavailable.

platform_toolsets:
  cli: [file, terminal, memory]
  telegram: [file, terminal, memory]
  api_server: [file, terminal, memory]
  cron: [file, terminal, memory]

terminal:
  backend: docker
  timeout: 300
  home_mode: profile
  lifetime_seconds: 600
  docker_image: hermes-coder:python3.11-nodejs20
  docker_mount_cwd_to_workspace: true
  # With a rootless daemon, container root maps to the unprivileged Hermes
  # account on the host. Do not pass the host UID again: it maps to a
  # subordinate ID and cannot write host-owned worktrees.
  docker_run_as_host_user: false
  docker_forward_env: []
  docker_network: false
  docker_extra_args: ["--pids-limit", "256"]
  container_cpu: 1
  container_memory: 1536
  container_persistent: true
  docker_persist_across_processes: false
  persistent_shell: false

worktree_sync: false

skills:
  creation_nudge_interval: 0
kanban:
  dispatch_in_gateway: false
_config_version: 50
onboarding:
  seen:
    tool_progress_prompt: true
_left_core_installed:
  - langfuse
