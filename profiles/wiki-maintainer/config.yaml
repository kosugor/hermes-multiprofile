database:
  journal_mode: wal
  synchronous: FULL

model:
  provider: openai-codex
  default: gpt-5.6-terra
  openai_runtime: auto

updates:
  check: false
  pre_update_backup: full
  non_interactive_local_changes: stash

fallback_providers:
  - provider: openrouter
    model: openrouter/free
  - provider: nous
    model: nous/welcome

nous:
  guest: true

agent:
  max_turns: 100
  reasoning_effort: medium
  verify_on_stop: true
  disabled_toolsets: [browser, web, computer_use, code_execution, delegation, messaging, cronjob, skills, skills_hub, vision, image_gen, tts]

platform_toolsets:
  cli: [file, terminal, memory]
  telegram: [file, terminal, memory]
  api_server: [file, terminal, memory]
  cron: [file, terminal, memory]

mcp_servers:
  qmd:
    command: "${userHome}/.hermes/qmd-runtime/node_modules/.bin/qmd"
    args: ["mcp"]
    env:
      PATH: "${userHome}/.hermes/node/bin:/usr/local/bin:/usr/bin:/bin"
      QMD_CONFIG_DIR: "${userHome}/.hermes/profiles/wiki-maintainer/qmd"
      QMD_FORCE_CPU: "1"
    timeout: 120
    connect_timeout: 45
    supports_parallel_tool_calls: false
    idle_timeout_seconds: 300
    max_lifetime_seconds: 1800
    trust: untrusted
    tools:
      include: [query, get, multi_get, status]
      resources: false
      prompts: false

terminal:
  backend: docker
  timeout: 180
  home_mode: profile
  lifetime_seconds: 600
  docker_image: hermes-sandbox:2026.09.11
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: true
  docker_forward_env: []
  docker_network: false
  docker_extra_args: ["--pids-limit", "256"]
  container_cpu: 1
  container_memory: 1536
  container_persistent: false
  docker_persist_across_processes: false
  persistent_shell: false

skills:
  creation_nudge_interval: 0
